<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyla Zhao | Data Analytics &amp; Reporting Portfolio</title>
<style>
:root {
  color-scheme: light;
  --paper: #f6f5f2;
  --surface: #fff;
  --ink: #242433;
  --muted: #4f505f;
  --line: #dedde4;
  --accent: #614695;
  --tint: #f1ecf8;
  font-family: Inter, "Segoe UI", system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.45;
}
* { box-sizing: border-box; }
body { margin: 0; }
body:has(dialog[open]) { overflow: hidden; }
main { max-width: 1250px; margin: auto; padding: 24px 32px 22px; }
h1, h2, h3, h4, p, figure, ul, ol { margin: 0; }
button, a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }
.eyebrow { font-size: .76rem; font-weight: 700; letter-spacing: .045em; color: var(--accent); }
#header { position: relative; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 17px; }
.identity { position: absolute; top: 0; right: 0; font-size: 1rem; }
h1 { font-size: clamp(1.6rem, 2.95vw, 2.25rem); letter-spacing: -.035em; line-height: 1.08; margin: 8px 0 12px; }
#header p { color: var(--muted); font-size: .96rem; }
#projects-title { font-size: 1.05rem; margin-bottom: 9px; }
.projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
[data-theme="2"] { --accent: #096a64; --tint: #e7f5f1; }
[data-theme="3"] { --accent: #8a461f; --tint: #f9eee4; }
[data-theme="4"] { --accent: #963c67; --tint: #faedf3; }

.card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, .82fr);
  align-items: center;
  gap: 13px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 12px 13px;
  transition: box-shadow 160ms ease, border-color 160ms ease;
}
.card:focus-within, .card:hover { box-shadow: 0 3px 14px #25243814; border-color: var(--accent); }
.card h3 { margin: 5px 0; font-size: clamp(1.04rem, 1.52vw, 1.24rem); line-height: 1.18; letter-spacing: -.025em; }
.card p { font-size: .87rem; color: var(--muted); }
.tags { padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 9px; }
.tags li { border-radius: 4px; padding: 1px 6px; background: var(--tint); color: var(--accent); font-size: .72rem; font-weight: 650; }
.explore { margin-top: 8px; border: 0; background: transparent; padding: 3px 0; font-size: .85rem; font-weight: 700; text-align: left; }
.explore:hover { text-decoration: underline; }
.preview { min-width: 0; }
.preview-frame, .report-thumb {
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  background: var(--tint);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.preview-frame img, .report-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--surface); }
.preview figcaption { margin-top: 4px; font-size: .72rem; color: var(--muted); }
.media-placeholder { padding: 9px; font-size: .78rem; text-align: center; color: var(--muted); }
.transfer { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 13px; border-top: 1px solid var(--line); margin-top: 16px; padding-top: 10px; }
.transfer h2 { font-size: .9rem; }
.transfer p, footer { font-size: .82rem; color: var(--muted); }
footer { margin-top: 7px; }

dialog {
  width: min(1200px, calc(100% - 24px));
  height: min(760px, calc(100dvh - 24px));
  max-width: none;
  max-height: none;
  margin: auto;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
}
dialog[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; animation: present 180ms ease-out; }
dialog::backdrop { background: #24243399; }
.case-top, .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px clamp(14px, 2.3vw, 28px); background: var(--surface); }
.case-top { border-bottom: 1px solid var(--line); }
.case-top h2 { font-size: .96rem; line-height: 1.3; }
.pager { border-top: 1px solid var(--line); }
.pager span { font-size: .82rem; font-weight: 650; text-align: center; }
#position { font-variant-numeric: tabular-nums; }
.control {
  flex-shrink: 0;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: var(--surface);
  padding: 6px 10px;
  min-height: 36px;
  font-size: .84rem;
  font-weight: 680;
}
.control:hover { background: var(--tint); }
.control[aria-disabled="true"] { color: var(--muted); border-color: var(--line); cursor: default; background: var(--surface); }
.control.primary:not([aria-disabled="true"]) { background: var(--accent); color: white; }
.case-body { overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; padding: clamp(14px, 2.1vw, 26px); }
.slide { animation: present 160ms ease-out; }
@keyframes present { from { opacity: .4; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
.slide h3 { font-size: clamp(1.45rem, 2.65vw, 2rem); letter-spacing: -.035em; line-height: 1.12; margin: 4px 0 6px; }
.lead { color: var(--muted); max-width: 80ch; }
.visuals { display: grid; gap: 12px; margin-top: 15px; }
.section-title { font-size: .9rem; margin-bottom: 6px; }
.flow {
  display: grid;
  grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
  gap: 18px;
  list-style: none;
  padding: 0;
}
.flow li {
  position: relative;
  align-content: center;
  min-width: 0;
  min-height: 52px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 2px solid var(--accent);
  padding: 8px 9px;
  border-radius: 7px;
  font-size: .87rem;
  font-weight: 650;
}
.flow li:not(:last-child)::after {
  content: '→'; position: absolute; left: calc(100% + 3px); top: 50%; transform: translateY(-50%); color: var(--accent); font-weight: 750;
}
.architecture li { align-content: start; }
.architecture li:nth-child(1) { border-top-color: #5e647b; }
.architecture li:nth-child(2) { border-top-color: #23736e; }
.architecture li:nth-child(3) { border-top-color: #66539b; }
.architecture li:nth-child(4) { border-top-color: #3b5f87; }
.architecture li span { display: block; margin-top: 4px; font-size: .78rem; font-weight: 450; color: var(--muted); }
.branch { height: 17px; width: 100%; margin: 0; position: relative; }
.branch::before { content: ''; position: absolute; right: 12.5%; height: 100%; border-right: 1px solid var(--accent); }
.branch::after { content: ''; position: absolute; left: 30%; right: 12.5%; bottom: 0; border-bottom: 1px solid var(--accent); }
.audiences { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }
.audience { position: relative; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; min-width: 0; }
.audience::before { content: ''; position: absolute; top: -9px; left: 50%; height: 8px; border-left: 1px solid var(--accent); }
.audience h4 { font-size: .92rem; color: var(--accent); }
.audience p { font-size: .8rem; color: var(--muted); }
.report-list { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.report-button { display: block; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 5px; text-align: left; min-width: 0; }
.report-button:hover { border-color: var(--accent); background: var(--tint); }
.report-button .report-thumb { aspect-ratio: 19 / 8; }
.report-button strong { display: block; margin-top: 3px; font-size: .76rem; line-height: 1.25; }
.compare { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); gap: 9px; }
.compare article { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; }
.compare article:last-child { border-color: var(--line); background: var(--tint); }
.compare h4 { color: var(--accent); font-size: 1rem; margin-bottom: 4px; }
.compare ul, .future ul { padding-left: 1.1em; font-size: .9rem; }
.compare li + li, .future li + li { margin-top: 3px; }
.takeaway { padding: 10px 13px; margin-top: 12px; background: var(--tint); border-left: 3px solid var(--accent); border-radius: 4px; font-weight: 650; }
.metric { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1px 13px; color: var(--accent); margin-top: 9px; }
.metric strong { font-size: clamp(1.65rem, 3.5vw, 2.75rem); letter-spacing: -.045em; line-height: 1.1; }
.metric span { font-size: .95rem; font-weight: 650; }
.future { margin-top: 14px; }
.future ul { display: flex; flex-wrap: wrap; gap: 3px 26px; }
.future li + li { margin-top: 0; }
.evidence-groups { display: grid; gap: 7px; }
.evidence-previews { display: flex; flex-wrap: wrap; gap: 8px; }
.evidence-previews .report-button { width: min(100%, 176px); }
.evidence-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.evidence-group > strong { font-size: .83rem; margin-right: 4px; }
.chip { padding: 4px 8px; font-size: .78rem; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; }
.chip:hover, .chip[aria-current="true"] { background: var(--tint); border-color: var(--accent); }
.tech { margin-top: 12px; color: var(--muted); font-size: .87rem; }
.tech summary { font-weight: 675; color: var(--accent); cursor: pointer; }
.tech p { margin-top: 5px; }
.sample-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin-bottom: 7px; }
.sample-bar .control { min-height: 32px; }
.sample-list { display: flex; flex-wrap: wrap; gap: 5px; }
.sample-frame { position: relative; display: grid; place-items: center; height: clamp(120px, calc(100dvh - 285px), 420px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 8px; }
.sample-frame img, .sample-frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.sample-view figcaption { padding-top: 6px; font-size: .84rem; color: var(--muted); }
.media-actions { display: flex; gap: 6px; }

@media (max-width: 920px) {
  .card { grid-template-columns: minmax(0, 1fr) minmax(0, .64fr); }
}
@media (max-width: 720px) {
  main { padding: 16px; }
  .projects { grid-template-columns: 1fr; }
  .flow { grid-template-columns: 1fr; gap: 13px; }
  .flow li { min-height: 0; }
  .flow li:not(:last-child)::after { content: '↓'; left: 14px; top: calc(100% - 2px); transform: none; line-height: 1; }
  .audiences { grid-template-columns: 1fr; margin-top: 8px; }
  .branch, .audience::before { display: none; }
  .audience { margin-top: 0; }
  .compare { grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); }
}
@media (max-width: 440px) {
  .identity { position: static; margin-top: 4px; }
  .card { grid-template-columns: 1fr; }
  .case-top { gap: 7px; }
  .case-top .control { font-size: .74rem; white-space: normal; }
  .case-top h2 { font-size: .83rem; }
}
@media (max-height: 625px) and (min-width: 721px) {
  .case-body { padding-block: 11px; }
  .case-top, .pager { padding-block: 6px; }
  .visuals { margin-top: 9px; gap: 8px; }
  .flow li { padding-block: 5px; min-height: 40px; }
  .report-button .report-thumb { aspect-ratio: 24 / 8; }
  .tech, .future { margin-top: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@page { size: A4 portrait; margin: 12mm; }
@media print {
  :root, .card { background: #fff; }
  body:has(dialog[open]) { overflow: visible; }
  main { padding: 0; }
  .projects { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { break-inside: avoid; box-shadow: none !important; }
  .explore, dialog { display: none !important; }
}
/* Give the diagrams room while keeping the stage controls in view. */
dialog {
  width: min(1450px, calc(100% - 48px));
  height: min(980px, calc(100dvh - 48px));
}
.case-body { display: flex; flex-direction: column; padding: clamp(16px, 2.6vw, 38px); }
.slide, .sample-view { flex: none; margin-block: auto; min-width: 0; }
.slide h3 { font-size: clamp(1.7rem, 3vw, 2.75rem); }
.visuals { gap: 18px; margin-top: clamp(15px, 2.2vw, 28px); }
.panel-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.stage-panel, .track, .match-card {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  padding: clamp(13px, 1.7vw, 24px);
}
.stage-panel h4, .track h4, .match-card h4 { font-size: clamp(1rem, 1.6vw, 1.18rem); margin-bottom: 12px; }
.stage-panel h4 span { color: var(--accent); margin-right: .35em; }
.stage-panel .flow li { text-align: center; background: var(--tint); border-top: 1px solid var(--line); }
.repeat-loop { color: var(--accent); text-align: center; margin-top: 12px; font-size: .9rem; font-weight: 650; }
.merge-diagram { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; align-items: center; }
.merge-node, .merge-result { border: 1px solid var(--line); border-radius: 6px; padding: 7px; background: var(--surface); font-weight: 650; text-align: center; }
.merge-diagram .merge-node { position: relative; }
.merge-diagram .merge-node::after { position: absolute; content: ''; top: 100%; left: 50%; height: 9px; border-left: 1px solid var(--accent); }
.merge-connector { grid-column: 1 / -1; height: 17px; position: relative; }
.merge-connector::before { position: absolute; content: ''; left: 24%; right: 24%; top: 9px; border-top: 1px solid var(--accent); }
.merge-connector::after { position: absolute; content: '↓'; left: 50%; top: 5px; transform: translateX(-50%); color: var(--accent); line-height: 1; font-weight: 750; background: var(--surface); }
.merge-result { grid-column: 1 / -1; justify-self: center; background: var(--tint); padding-inline: 16px; }
.takeaway { margin-top: 20px; padding: 13px 16px; }
.architecture { gap: 28px; }
.architecture > li { padding: clamp(10px, 1.3vw, 17px); }
.architecture > li:not(:last-child)::after { left: calc(100% + 6px); font-size: 1.1rem; }
.architecture > li > strong { font-size: clamp(.93rem, 1.32vw, 1.1rem); }
.architecture li span { margin-top: 3px; font-size: clamp(.8rem, 1.06vw, .94rem); }
.architecture li span:first-of-type { margin-top: 9px; }
.source-stack { display: grid; gap: 7px; margin-top: 9px; position: relative; margin-right: 12px; }
.source-stack .merge-node { background: var(--tint); position: relative; padding: 4px 7px; }
.source-stack .merge-node::after { content: ''; position: absolute; top: 50%; left: calc(100% + 1px); width: 11px; border-top: 1px solid var(--accent); }
.source-stack::after { content: ''; position: absolute; right: -12px; top: 21%; bottom: 21%; border-right: 1px solid var(--accent); }
.source-exit { display: none; }
@media (min-width: 721px) {
  .architecture > li:first-child::after { display: none; }
  .source-exit { display: block; position: absolute; top: 50%; left: calc(100% + 12px); right: calc(-35px - clamp(10px, 1.3vw, 17px)); border-top: 1px solid var(--accent); }
  .source-exit::after { content: ''; position: absolute; top: -4px; right: 0; border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; border-left: 6px solid var(--accent); }
}

.branch { height: 31px; }
.audiences { gap: 14px; }
.audience { padding: 12px 13px; }
.audience h4 { font-size: 1.03rem; }
.audience p { font-size: .85rem; }
.report-list { gap: 8px; margin-top: 8px; }
.report-button .report-thumb { aspect-ratio: 16 / 8; max-height: 138px; }
.report-button strong { font-size: .83rem; }
.impact .metric { margin-top: 14px; gap: 6px 15px; }
.impact .metric strong { font-size: clamp(2.45rem, 5.6vw, 5.4rem); }
.impact .metric span { font-size: clamp(1rem, 1.8vw, 1.35rem); }
.impact .compare { grid-auto-rows: 1fr; gap: 14px; }
.impact .compare article { background: #f0efee; padding: clamp(14px, 2vw, 25px); }
.impact .compare article:last-child { background: var(--tint); border-color: color-mix(in srgb, var(--accent) 32%, var(--line)); }
.impact .compare h4 { font-size: .91rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 9px; }
.impact .compare ul { font-size: clamp(.93rem, 1.35vw, 1.13rem); }
.impact .compare li + li { margin-top: 6px; }
.future { border-top: 1px solid var(--line); padding-top: 11px; margin-top: 18px; color: var(--muted); }
.future .section-title { font-size: .83rem; }
.future ul { font-size: .83rem; }
.match-board { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.2fr); gap: 10px; align-items: stretch; }
.match-board .merge-diagram { grid-column: 1 / -1; align-self: start; justify-self: center; width: min(100%, 440px); }
.match-card h4 { margin-bottom: 6px; color: var(--accent); }
.match-card p { margin-top: 3px; font-size: .91rem; }
.match-arrow { align-self: center; color: var(--accent); font-size: 1.25rem; font-weight: 700; }
.quality-table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; font-size: .92rem; }
.quality-table th, .quality-table td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); padding: 9px 12px; width: 33.33%; }
.quality-table th { background: var(--tint); color: var(--accent); }
.quality-table tbody tr:last-child td { border-bottom: 0; }
.quality-tools { color: var(--muted); margin-top: 7px; font-size: .86rem; font-weight: 650; }
.track h4 { color: var(--accent); margin-bottom: 9px; }
.track-step { margin-top: 6px; padding: 7px 9px; border-radius: 5px; background: #f0efee; }
.track-step strong { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
.track-step span { font-size: .93rem; }
.track-step + .track-step { background: var(--tint); }
.sample-frame { height: clamp(120px, calc(100dvh - 310px), 660px); }

@media (max-width: 720px) {
  dialog { width: calc(100% - 16px); height: calc(100dvh - 16px); }
  .panel-grid { grid-template-columns: 1fr; gap: 8px; }
  .architecture { gap: 14px; }
  .architecture > li:not(:last-child)::after { left: 14px; }
  .source-stack { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-right: 0; }
  .source-stack::after, .source-stack .merge-node::after { display: none; }
  .quality-table { font-size: .8rem; }
  .quality-table th, .quality-table td { padding: 6px; overflow-wrap: anywhere; }
}
@media (max-height: 625px) and (min-width: 721px) {
  dialog { height: calc(100dvh - 16px); }
  .case-body { padding-block: 10px; }
  .slide h3 { font-size: 1.75rem; }
  .visuals { margin-top: 10px; gap: 9px; }
  .architecture > li { padding: 7px 9px; }
  .architecture li span { margin-top: 1px; font-size: .78rem; }
  .architecture li span:first-of-type { margin-top: 3px; }
  .branch { height: 15px; }
  .audience { padding: 6px 7px; }
  .report-button .report-thumb { aspect-ratio: 24 / 8; }
}
</style>
</head>
<body>
<main>
  <header id="header"></header>
  <section aria-labelledby="projects-title">
    <h2 id="projects-title">Selected Projects</h2>
    <div class="projects" id="projects"></div>
  </section>
  <section class="transfer" aria-labelledby="transfer-title">
    <h2 id="transfer-title">How this maps to the role</h2>
    <p id="capabilities"></p>
  </section>
  <footer id="footer"></footer>
</main>

<dialog id="detail" aria-labelledby="detail-title">
  <div class="case-top">
    <h2 id="detail-title"></h2>
    <form method="dialog"><button class="control" autofocus>Back to Portfolio</button></form>
  </div>
  <div class="case-body" id="case-body"></div>
  <nav class="pager" aria-label="Case study stages">
    <button class="control" id="previous" type="button">Previous</button>
    <span aria-live="polite"><span id="position"></span><span aria-hidden="true"> · </span><span id="step-name"></span></span>
    <button class="control primary" id="next" type="button">Next</button>
  </nav>
</dialog>

<script>
"use strict";
// Edit project stages, sample captions and local media paths here. Use reviewed media only.
const portfolio = {
  "name": "Skyla Zhao",
  "eyebrow": "DATA ANALYTICS & REPORTING PORTFOLIO",
  "headline": "From Operational Data to Trusted Decisions",
  "statement": "Transforming complex operational data into reliable reporting, actionable insights, and efficient workflows.",
  "projects": [
    {
      "category": "Business Intelligence",
      "title": "Billing Operations Performance Dashboard",
      "tools": [
        "Power BI",
        "Power Query",
        "DAX"
      ],
      "samples": [
        {
          "title": "Billing Overview",
          "kind": "image",
          "caption": "Monitor completion rates, outstanding accounts and routes requiring attention."
        },
        {
          "title": "Route Details",
          "kind": "image",
          "caption": "Enables cycle- and route-level investigation to identify incomplete work and prioritize follow-up. Synthetic demonstration data."
        },
        {
          "title": "Unbilled Account Details",
          "kind": "image",
          "caption": "Supports investigation of outstanding accounts by billing type, cycle and processing status. Synthetic demonstration data."
        },
        {
          "title": "Cycle Performance",
          "kind": "image",
          "caption": "Combines completion rates, deadlines, ownership and exception information for operational review. Synthetic demonstration data."

function add(parent, tag, text = "", className = "") {
  const element = document.createElement(tag);
  if (text) element.textContent = text;
  if (className) element.className = className;
  parent.append(element);
  return element;
}

function button(parent, label, className, action) {
  const element = add(parent, "button", label, className);
  element.type = "button";
  element.addEventListener("click", action);
  return element;
}

function previewImage(frame, sample) {
  const fallback = add(frame, "span", "", "media-placeholder");
  fallback.setAttribute("aria-hidden", "true");
  if (!sample?.path || sample.kind !== "image") {
    fallback.textContent = "Interview preview";
    return;
  }
  const image = add(frame, "img");
  image.alt = "";
  image.hidden = true;
  image.decoding = "async";
  image.addEventListener("load", () => {
    fallback.hidden = true;
    image.hidden = false;
  }, { once: true });
  image.addEventListener("error", () => {
    fallback.textContent = "Interview preview";
  }, { once: true });
  image.src = sample.path;
}

function list(parent, items) {
  const element = add(parent, "ul");
  for (const item of items) add(element, "li", item);
}

function columnGrid(element, count) {
  element.style.setProperty("--columns", count);
  return element;
}

function flow(parent, nodes) {
  const route = columnGrid(add(parent, "ol", "", "flow"), nodes.length);
  route.setAttribute("aria-label", "Process in order");
  for (const node of nodes) add(route, "li", node);
}

function mergeDiagram(parent, sources, result) {
  const diagram = add(parent, "div", "", "merge-diagram");
  for (const source of sources) add(diagram, "div", source, "merge-node");
  add(diagram, "div", "", "merge-connector").setAttribute("aria-hidden", "true");
  add(diagram, "div", result, "merge-result");
}

function renderChallengePanels(parent, visual) {
  const grid = add(parent, "div", "", "panel-grid");
  const manual = add(grid, "section", "", "stage-panel");
  const title = add(manual, "h4");
  add(title, "span", "↻").setAttribute("aria-hidden", "true");
  title.append("Too Many Manual Steps");
  flow(manual, visual.manual);
  add(manual, "p", visual.repeat, "repeat-loop");

  const systems = add(grid, "section", "", "stage-panel");
  add(systems, "h4", "Fragmented Systems");
  mergeDiagram(systems, visual.sources, visual.join);
}

function renderMatching(parent, visual) {
  const board = add(parent, "div", "", "match-board");
  mergeDiagram(board, visual.inputs, "Bring sources together");
  for (const item of [visual.match, visual.results]) {
    if (item === visual.results) add(board, "div", "→", "match-arrow").setAttribute("aria-hidden", "true");
    const card = add(board, "section", "", "match-card");
    add(card, "h4", item.title);
    for (const detail of item.lines) add(card, "p", detail);
  }
}

function renderQuality(parent, visual) {
  const table = add(parent, "table", "", "quality-table");
  const headings = add(add(table, "thead"), "tr");
  for (const title of visual.headers) add(headings, "th", title).scope = "col";
  const data = add(table, "tbody");
  for (const values of visual.rows) {
    const row = add(data, "tr");
    for (const value of values) add(row, "td", value);
  }
  add(parent, "p", visual.tools, "quality-tools");
}

function renderWorktracks(parent, visual) {
  const grid = add(parent, "div", "", "panel-grid");
  for (const track of visual.tracks) {
    const lane = add(grid, "section", "", "track");
    add(lane, "h4", track.title);
    for (const [label, description] of [["Manual", track.before], ["Automated", track.after]]) {
      const step = add(lane, "p", "", "track-step");
      add(step, "strong", label);
      add(step, "span", description);
    }
  }
}

function renderEvidence(parent, visual) {
  if (!visual.groups && visual.samples.length <= 2) {
    const previews = add(parent, "div", "", "evidence-previews");
    for (const index of visual.samples) {
      const sample = project.samples[index];
      const trigger = button(previews, "", "report-button", () => showSample(index, visual.samples, trigger));
      previewImage(add(trigger, "span", "", "report-thumb"), sample);
      add(trigger, "strong", sample.title);
    }
    return;
  }
  const groups = visual.groups ?? [{ samples: visual.samples }];
  const wrapper = add(parent, "div", "", "evidence-groups");
  for (const group of groups) {
    const row = add(wrapper, "div", "", "evidence-group");
    if (group.title) add(row, "strong", group.title);
    for (const index of group.samples) {
      const sample = project.samples[index];
      const trigger = button(row, sample.title, "chip", () => showSample(index, visual.samples, trigger));
    }
  }
}

function renderArchitecture(parent, visual) {
  const route = columnGrid(add(parent, "ol", "", "flow architecture"), visual.nodes.length);
  route.setAttribute("aria-label", "Reporting architecture in order");
  for (const node of visual.nodes) {
    const layer = add(route, "li");
    add(layer, "strong", node.title);
    if (node.sources) {
      const sources = add(layer, "div", "", "source-stack");
      for (const source of node.sources) add(sources, "div", source, "merge-node");
      add(sources, "div", "", "source-exit").setAttribute("aria-hidden", "true");
    }
    for (const detail of node.lines ?? []) add(layer, "span", detail);
  }
  add(parent, "div", "", "branch").setAttribute("aria-hidden", "true");
  const groups = add(parent, "div", "", "audiences");
  const indices = visual.audiences.flatMap(group => group.reports.map(report => report.sample));
  for (const group of visual.audiences) {
    const audience = add(groups, "section", "", "audience");
    add(audience, "h4", group.title);
    add(audience, "p", group.detail);
    const reports = columnGrid(add(audience, "div", "", "report-list"), group.reports.length);
    for (const report of group.reports) {
      const trigger = button(reports, "", "report-button", () => showSample(report.sample, indices, trigger));
      previewImage(add(trigger, "span", "", "report-thumb"), project.samples[report.sample]);
      add(trigger, "strong", report.title);
    }
  }
}

function renderVisual(parent, visual) {
  const region = add(parent, "div");
  if (visual.label) add(region, "h4", visual.label, "section-title");
  switch (visual.kind) {
    case "flow":
      flow(region, visual.nodes);
      break;
    case "challengePanels":
      renderChallengePanels(region, visual);
      break;
    case "matching":
      renderMatching(region, visual);
      break;
    case "quality":
      renderQuality(region, visual);
      break;
    case "worktracks":
      renderWorktracks(region, visual);
      break;
    case "architecture":
      renderArchitecture(region, visual);
      break;
    case "compare":
    case "risks": {
      const grid = columnGrid(add(region, "div", "", "compare"), visual.cards.length);
      for (const item of visual.cards) {
        const card = add(grid, "article");
        add(card, "h4", item.title);
        list(card, item.items);
      }
      break;
    }
    case "evidence":
      renderEvidence(region, visual);
      break;
  }
}

function clearBody() {
  body.querySelector("video")?.pause();
  body.replaceChildren();
  body.scrollTop = 0;
}

function renderStage() {
  sampleReturn = null;
  clearBody();
  const stage = project.stages[stageIndex];
  const slide = add(body, "section", "", stageIndex === 2 ? "slide impact" : "slide");
  const step = String(stageIndex + 1).padStart(2, "0");
  add(slide, "p", stages[stageIndex], "eyebrow");
  add(slide, "h3", stage.title);
  if (stage.lead) add(slide, "p", stage.lead, "lead");
  if (stage.metric) {
    const metric = add(slide, "div", "", "metric");
    add(metric, "strong", stage.metric.value);
    add(metric, "span", stage.metric.label);
  }
  const visuals = add(slide, "div", "", "visuals");
  for (const visual of stage.visuals) renderVisual(visuals, visual);
  if (stage.takeaway) add(slide, "p", stage.takeaway, "takeaway");
  if (stage.future) {
    const future = add(slide, "section", "", "future");
    add(future, "h4", "Future Opportunities", "section-title");
    list(future, stage.future);
  }
  if (stage.technical) {
    const technical = add(slide, "details", "", "tech");
    add(technical, "summary", "Technical Details");
    for (const [label, description] of stage.technical) {
      const paragraph = add(technical, "p");
      add(paragraph, "strong", label + ". ");
      paragraph.append(description);
    }
    if (stage.artifact) {
      const line = add(technical, "p");
      if (stage.artifact.path) {
        add(line, "a", stage.artifact.label).href = stage.artifact.path;
      } else {
        line.textContent = "Source file unavailable in this portfolio. See the screenshots above.";
      }
    }
  }
  document.getElementById("position").textContent = step + " / " + String(project.stages.length).padStart(2, "0");
  document.getElementById("step-name").textContent = stages[stageIndex];
  previous.setAttribute("aria-disabled", String(stageIndex === 0));
  next.setAttribute("aria-disabled", String(stageIndex === project.stages.length - 1));
}

function showSample(index, indices, trigger) {
  sampleReturn = trigger;
  clearBody();
  const sample = project.samples[index];
  const view = add(body, "section", "", "sample-view");
  const bar = add(view, "div", "", "sample-bar");
  const back = button(bar, "Close preview", "control", closeSample);
  add(bar, "h3", sample.title);
  const actions = add(bar, "div", "", "media-actions");
  const navigation = add(view, "nav", "", "sample-list");
  navigation.setAttribute("aria-label", "Project samples");
  for (const candidate of indices) {
    const chip = button(navigation, project.samples[candidate].title, "chip", () => showSample(candidate, indices, trigger));
    if (candidate === index) chip.setAttribute("aria-current", "true");
  }
  const figure = add(view, "figure");
  const frame = add(figure, "div", "", "sample-frame");
  const placeholder = add(frame, "p", sample.path ? "Loading sample…" : "Sample available during the interview", "media-placeholder");
  add(figure, "figcaption", sample.caption);
  back.focus();
  if (!sample.path) return;

  const isVideo = sample.kind === "video";
  const media = add(frame, isVideo ? "video" : "img");
  media.hidden = true;
  let play;
  let full;
  if (isVideo) {
    media.controls = true;
    media.preload = "metadata";
    media.setAttribute("aria-label", sample.title);
    play = button(actions, "Play Video", "control primary", () => {
      if (media.paused) {
        media.play().catch(() => { play.textContent = "Try Play Video Again"; });
      } else {
        media.pause();
      }
    });
    play.hidden = true;
    for (const [event, label] of [["play", "Pause Video"], ["pause", "Play Video"], ["ended", "Replay Video"]]) {
      media.addEventListener(event, () => { play.textContent = label; });
    }
  } else {
    media.alt = sample.title;
    full = add(actions, "a", "Open full size");
    full.href = sample.path;
    full.target = "_blank";
    full.rel = "noopener";
    full.hidden = true;
  }
  media.addEventListener(isVideo ? "loadedmetadata" : "load", () => {
    media.hidden = false;
    placeholder.hidden = true;
    (play ?? full).hidden = false;
  }, { once: true });
  media.addEventListener("error", () => {
    media.hidden = true;
    (play ?? full).hidden = true;
    placeholder.hidden = false;
    placeholder.textContent = isVideo ? "Video unavailable" : "Screenshot unavailable";
  }, { once: true });
  media.src = sample.path;
}

function closeSample() {
  const trigger = sampleReturn;
  const label = trigger?.textContent;
  renderStage();
  const replacement = Array.from(body.querySelectorAll("button")).find(control => control.textContent === label);
  replacement?.focus();
}

function moveStage(delta) {
  const target = stageIndex + delta;
  if (target < 0 || target >= project.stages.length) return;
  stageIndex = target;
  renderStage();
}

previous.addEventListener("click", () => moveStage(-1));
next.addEventListener("click", () => moveStage(1));
dialog.addEventListener("keydown", event => {
  if (event.target instanceof HTMLVideoElement || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    event.preventDefault();
    moveStage(event.key === "ArrowLeft" ? -1 : 1);
  }
});
dialog.addEventListener("cancel", event => {
  if (!sampleReturn) return;
  event.preventDefault();
  closeSample();
});
dialog.addEventListener("close", clearBody);

const header = document.getElementById("header");
add(header, "div", portfolio.eyebrow, "eyebrow");
add(header, "strong", portfolio.name, "identity");
add(header, "h1", portfolio.headline);
add(header, "p", portfolio.statement);
const grid = document.getElementById("projects");
for (const [index, item] of portfolio.projects.entries()) {
  const number = String(index + 1).padStart(2, "0");
  const card = add(grid, "article", "", "card");
  card.dataset.theme = String(index + 1);
  const copy = add(card, "div");
  add(copy, "div", number + " / " + item.category, "eyebrow");
  add(copy, "h3", item.title);
  add(copy, "p", item.summary);
  const tags = add(copy, "ul", "", "tags");
  tags.setAttribute("aria-label", "Technologies");
  for (const tool of item.tools) add(tags, "li", tool);
  const explore = button(copy, "Explore project", "explore", () => {
    project = item;
    stageIndex = 0;
    dialog.dataset.theme = card.dataset.theme;
    document.getElementById("detail-title").textContent = number + " / " + item.title;
    renderStage();
    dialog.showModal();
  });
  explore.setAttribute("aria-label", "Explore project " + number + " · " + item.title);
  const preview = add(card, "figure", "", "preview");
  previewImage(add(preview, "div", "", "preview-frame"), item.samples[item.preview]);
  add(preview, "figcaption", item.previewLabel);
}
document.getElementById("capabilities").textContent = portfolio.capabilities.join(" · ");
document.getElementById("footer").textContent = portfolio.footer;
</script>
</body>
</html>
